    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    -- Adicione aqui o conteúdo do seu arquivo createdb.sql
  2-inserts.sql: |
    -- Scripts de inserção de dados
    -- Este conteúdo será substituído pelos seus arquivos inserts.sql real
    -- Adicione aqui o conteúdo do seu arquivo inserts.sql