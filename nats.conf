# Configuração do NATS Server com JetStream habilitado
listen: 0.0.0.0:4222

# Habilitar JetStream
jetstream {
  store_dir: /data
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Configurações de logging
debug: false
trace: false

# Configurações de cluster (opcional)
authorization {
  # Permitir conexões sem autenticação para desenvolvimento
  # Em produção, configure usuários e permissões apropriadas
}