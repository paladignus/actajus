syntax = "proto3";

package validation.v1;

option go_package = "github.com/paladignus/actajus/proto/validation/v1;validationv1"; 

message ValidationErrorDetail {
  repeated Violation violations = 1;

  message Violation {
    string path = 1;
    string code = 2;
    map<string, string> meta = 3;
  }
}

